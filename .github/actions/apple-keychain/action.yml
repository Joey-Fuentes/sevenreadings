name: Import an Apple signing certificate
description: >
  Puts a .p12 certificate (base64 in a secret) into a temporary keychain on
  the macOS runner so codesign and xcodebuild can use it. The keychain is
  named in the `keychain` output; delete it at the end of the job.
inputs:
  p12-base64:
    description: The certificate and private key, .p12, base64-encoded
    required: true
  password:
    description: The .p12 password
    required: true
outputs:
  keychain:
    description: Path of the temporary keychain
    value: ${{ steps.import.outputs.keychain }}
runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        P12_BASE64: ${{ inputs.p12-base64 }}
        P12_PASSWORD: ${{ inputs.password }}
      run: |
        set -euo pipefail
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password=$(openssl rand -hex 24)
        echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
          -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
        # Lets codesign use the key without a UI prompt.
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" login.keychain-db
        rm -f "$RUNNER_TEMP/certificate.p12"
        echo "Identities in the temporary keychain:"
        security find-identity -v -p codesigning "$keychain"
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
