name: Tools for offline review

# Manual. Packages the pipeline's resolved dev environment (ruff, pytest,
# httpx and their dependencies) as wheels, so an environment without network
# access can install them with
#   pip install --no-index --find-links wheels -r wheels/requirements.txt
# and get the same lint, format and test results as CI.

on:
  workflow_dispatch:

jobs:
  pipeline-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-dependency-glob: pipeline/pyproject.toml
      - name: Resolve the project's ruff version
        id: ruff
        working-directory: pipeline
        run: |
          uv sync
          v=$(uv run ruff --version | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ruff $v"
      - name: Download wheels for the resolved dev environment (x86_64 Linux, Python 3.12)
        working-directory: pipeline
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o ../wheels-req.txt
          mkdir -p ../wheels
          pip download -r ../wheels-req.txt --only-binary=:all: --no-deps \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --platform any \
            --python-version 3.12 --implementation py --abi none \
            --dest ../wheels
          cp ../wheels-req.txt ../wheels/requirements.txt
          ls -la ../wheels
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-wheels-ruff-${{ steps.ruff.outputs.version }}
          path: wheels/
          if-no-files-found: error
          retention-days: 30
