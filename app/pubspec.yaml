name: sevenreadings
description: Scripture study across seven readings. Offline, local-only.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  sr_core:
    path: ../packages/sr_core
  sr_data:
    path: ../packages/sr_data
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.0
  # Tips through Google Play and App Store billing in store builds
  # (features/support/tips.dart); BSD-3. No implementation on Windows,
  # Linux or web, where the code is never reached.
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Windows packaging (MIT): `dart run msix:create` in build.yml. The
  # Store identity comes from secrets at build time (docs/workflow.md,
  # "Signing"); this block is what every MSIX shares.
  msix: ^3.18.0

msix_config:
  display_name: Seven Readings
  publisher_display_name: Seven Readings
  identity_name: SevenReadings.SevenReadings
  logo_path: ../packaging/icon/org.sevenreadings.SevenReadings-512.png
  capabilities: ""
  build_windows: false
  output_path: ../
  output_name: sevenreadings-windows

flutter:
  uses-material-design: true
  # Both files are produced by the content pipeline / fetched by CI.
  # They are gitignored. `make content-sample` creates them locally.
  assets:
    - assets/content/sevenreadings.sqlite
    - assets/content/manifest.json
