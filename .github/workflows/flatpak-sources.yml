name: Flatpak sources

# Generates the offline, build-from-source Flatpak manifest with
# flatpak-flutter (docs/plan.md, S3) and commits it with the files it
# produced: packaging/flatpak/org.sevenreadings.SevenReadings.yml and
# packaging/flatpak/generated/ (the Flutter SDK module, the offline pub
# cache, the patches). Run after a dependency, Flutter or content change, and
# before a release (with the tag). The `flatpak` job in screenshots.yml
# then builds that manifest in Flathub's sandbox, with no network, exactly
# as Flathub's own build will.
#
#   gh workflow run flatpak-sources.yml                  # pins the current commit
#   gh workflow run flatpak-sources.yml -f tag=v0.1.0    # pins a release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (empty = the current commit)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: flatpak-sources
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: flatpak-flutter (TheAppgineer, MIT)
        run: |
          pip install --quiet packaging pyyaml tomlkit
          git clone --depth 1 https://github.com/TheAppgineer/flatpak-flutter.git "$HOME/flatpak-flutter"
          echo "flatpak-flutter $(git -C "$HOME/flatpak-flutter" rev-parse --short HEAD)"
      - name: Render the template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(jq -r .version app/content.lock)
          mkdir -p build/content
          gh release download "content-v${version}" -p manifest.json -D build/content --clobber
          sha=$(sha256sum build/content/manifest.json | cut -d' ' -f1)
          # The current SQLite amalgamation: sqlite.org's download page lists
          # only the newest release (an exact older pin, 3.53.3, was not on
          # it, 2026-09-16), and package:sqlite3 compiles whatever sqlite3.c
          # it is given with its own options. The rendered manifest pins the
          # version and checksum this run saw.
          path=$(curl -fsSL https://sqlite.org/download.html | grep -o '[0-9]\{4\}/sqlite-amalgamation-[0-9]*\.zip' | head -n1)
          test -n "$path" || { echo "no amalgamation on sqlite.org/download.html"; exit 1; }
          echo "SQLite amalgamation: $path"
          curl -fsSL -o build/content/amalgamation.zip "https://sqlite.org/$path"
          sqlite_sha=$(sha256sum build/content/amalgamation.zip | cut -d' ' -f1)
          ref=(--commit "$GITHUB_SHA")
          [ -n "${{ inputs.tag }}" ] && ref=(--tag "${{ inputs.tag }}")
          python3 tools/flatpak-template.py "${ref[@]}" --manifest-sha256 "$sha" \
            --sqlite-path "$path" --sqlite-sha256 "$sqlite_sha"
      - name: Generate the offline manifest
        working-directory: packaging/flatpak
        # A pub workspace has one pubspec.lock, at the root, naming every
        # package of every member. The tool's --app-pubspec and
        # --extra-pubspecs are directories in which it expects a pubspec.lock
        # (flatpak-flutter.py, _create_pub_cache and _generate_pubspec_sources),
        # so neither fits a workspace; with no flags it reads the lock at the
        # repository root, which is the right one (runs 1 and 2, 2026-09-16).
        # Outputs: org.sevenreadings.SevenReadings.yml and generated/
        # (modules/flutter-sdk-<tag>.json, sources/pubspec.json, patches/).
        run: |
          python3 "$HOME/flatpak-flutter/flatpak-flutter.py" \
            --app-module sevenreadings \
            flatpak-flutter.yml
          echo "--- generated ---"; ls -la
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/flatpak
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Flatpak: offline sources from flatpak-flutter (${{ inputs.tag || github.sha }})"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
