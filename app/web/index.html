<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline Scripture study across seven readings: Bible text in English, Hebrew and Greek beside Jewish, Catholic, Orthodox, Protestant, Islamic and academic commentary.">
  <meta name="theme-color" content="#5B4636">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Seven Readings">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Seven Readings</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #FFF8F5; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 24px;
      font: 16px/1.5 system-ui, sans-serif; color: #5B4636;
    }
  </style>
</head>
<body>
  <!-- Shown until the app's engine has loaded; flutter_bootstrap.js
       (ours, next to this file) removes it. -->
  <div id="loading">Seven Readings is loading…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline: sw.js caches the app itself (the texts live in the
    // browser's storage once loaded). Written at build time; absent when
    // running from the dev server, hence the catch.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
