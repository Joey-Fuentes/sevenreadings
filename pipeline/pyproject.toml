[project]
name = "sevenreadings-pipeline"
version = "0.1.0"
description = "Turns pinned upstream Bible and commentary sources into the sevenreadings content database."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
srp = "sevenreadings_pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sevenreadings_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
