name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # used by content.yml after it pins a new release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze & test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # analyze treats the missing content assets as (fatal) warnings.
      - uses: ./.github/actions/content
        with:
          mode: sample
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test sr_core
        working-directory: packages/sr_core
        run: dart test
      - name: Test sr_data
        working-directory: packages/sr_data
        run: flutter test
      - name: Test app
        working-directory: app
        run: flutter test

  pipeline:
    name: Lint & test (pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Icons match tools/icons.py
        run: uv run --with pillow python ../tools/icons.py --check

  smoke:
    name: Smoke build (web + linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the latest screenshots run's artifacts, for the site
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          # PRs stay hermetic. Pushes to main use the pinned content release
          # once one exists, so the Pages deployment below ships real content.
          mode: ${{ github.event_name == 'pull_request' && 'sample' || 'auto' }}
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Web runtime assets
        run: tools/web-assets.sh
      - name: Build web
        working-directory: app
        # The site is served at https://sevenreadings.org/ (Pages custom
        # domain), so the base is the root. Without the custom domain it
        # would need --base-href "/<repo>/".
        run: flutter build web --release --base-href "/" --dart-define=SR_DISTRIBUTION=web
      - name: Service worker for the site
        # Before the screenshots land in the folder, and web-sw.py skips
        # screenshots/ regardless: the app's cache is the app, not the site.
        run: python3 tools/web-sw.py app/build/web
      - name: Latest screenshots onto the site (docs/plan.md, T4)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/site-screenshots.sh app/build/web
      - name: Build linux
        working-directory: app
        run: flutter build linux --release --dart-define=SR_DISTRIBUTION=direct
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: app/build/web

  pages:
    name: Deploy web app to GitHub Pages
    # Only after every CI job passed on main. Never on PRs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [dart, pipeline, smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
