name: Screenshots

# Runs the first-launch checklist (app/integration_test/app_test.dart) on
# every target that can run it headless, and keeps what each saw: the
# screenshots, the launch timings and (Android) the device log, as one
# `screenshots-<target>` artifact per job. The flatpak job builds the
# Flathub manifest from the bundle it just made, lints it with Flathub's
# linter and launches the sandboxed app once. On demand, weekly (after the
# build canary), and on every release tag; not on every push, because the
# emulator job takes about nine minutes. Every target has a job here
# (docs/plan.md T3); the contact sheet on Pages is T4 and picks up every
# `screenshots-<target>` artifact by name.

on:
  workflow_dispatch:
    inputs:
      content:
        description: Content to test against
        type: choice
        options: [release, sample]
        default: release
      distribution:
        description: >-
          SR_DISTRIBUTION of the build under test. A store value hides the
          Support band (as the store builds do) and makes the store job
          frame the screenshots for the listings.
        type: choice
        options: [direct, appstore]
        default: direct
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"

env:
  CONTENT_MODE: ${{ inputs.content || 'release' }}
  SR_DISTRIBUTION: ${{ inputs.distribution || 'direct' }}

jobs:
  android:
    name: Android emulator (API 34, Pixel 6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: ./.github/actions/setup-flutter
      - name: Enable KVM
        # The emulator needs hardware acceleration; the runner has it but the
        # device node is root-only until this rule is loaded.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the checklist on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          # One command: the runner executes every line of `script` in its
          # own shell. The script builds the debug APK, installs it, runs
          # the test, keeps screenshots, timings and the device log, and
          # fails unless ten screenshots and both timings came out.
          script: bash tools/checklist.sh emulator-5554
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-android
          path: |
            app/screenshots/
            app/build/integration_response_data.json
            app/build/logcat.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux desktop (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - name: Linux build deps and a virtual display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb libgl1-mesa-dri
      - uses: ./.github/actions/setup-flutter
      - name: Run the checklist under Xvfb
        # The desktop window is 1280x720, so this exercises the side-by-side
        # reader layout; the emulator exercises the phone one. Screenshots
        # are rendered by the test itself (no integration_test plugin on
        # desktop) and written by the same driver.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash tools/checklist.sh linux
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-linux
          path: |
            app/screenshots/
            app/build/integration_response_data.json
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - run: tools/web-assets.sh
      - name: Run the checklist in Chrome
        # The runner's chromedriver ($CHROMEWEBDRIVER) drives a headless
        # Chrome; flutter drive serves a debug build to it.
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          bash tools/checklist.sh chrome
      - name: Build the site and prove it installs and works offline
        # The release build with our service worker, served locally: the
        # reader must come up, the worker must control the page, and after
        # the network is cut a reload must bring the reader back.
        run: |
          cd app && flutter build web --release --base-href "/" --dart-define=SR_DISTRIBUTION=web && cd ..
          python3 tools/web-sw.py app/build/web
          pip install --quiet selenium
          python3 tools/web-offline-check.py app/build/web app/screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-web
          path: |
            app/screenshots/
            app/build/integration_response_data.json
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - name: Run the checklist on the desktop
        # The hosted Windows runner has an interactive desktop, so the app's
        # 1280x720 window (windows/runner/main.cpp) opens as it would for a
        # person; screenshots are rendered by the test, as on Linux. Git
        # Bash runs the same script; Flutter's bin/flutter is a bash script.
        shell: bash
        run: bash tools/checklist.sh windows
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-windows
          path: |
            app/screenshots/
            app/build/integration_response_data.json
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS desktop
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - name: Skia for this run's captures
        # The test's offscreen render (RepaintBoundary.toImage) garbled the
        # app bar's glyphs on macOS with Impeller, the default renderer,
        # while the window itself and the same capture on Windows and Linux
        # were fine (release run, 2026-09-18). This switches the debug build
        # under test to Skia; the shipped app keeps its Info.plist.
        run: plutil -replace FLTEnableImpeller -bool NO app/macos/Runner/Info.plist
      - name: Run the checklist on the desktop
        # Unsigned debug build in the app sandbox (DebugProfile.entitlements
        # allows the VM service's local server, which flutter drive needs).
        # The window is 1280x720 (macos/Runner/Base.lproj/MainMenu.xib), the
        # same layout as Linux and Windows.
        run: bash tools/checklist.sh macos
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-macos
          path: |
            app/screenshots/
            app/build/integration_response_data.json
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator (${{ matrix.device }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # iPhone for the phone layout; iPad because the app runs there too
        # and the App Store then requires 13" iPad screenshots (S4).
        include:
          - { device: iPhone, target: iphone }
          - { device: iPad, target: ipad }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - name: Boot a simulator
        # The newest available device of this kind on the runner's newest
        # iOS runtime. Its udid is what flutter drive takes as the device.
        id: sim
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r --arg d "$DEVICE" '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.isAvailable and (.name | startswith($d)))]
                     | sort_by(.name) | last | .udid')
          [ -n "$udid" ] && [ "$udid" != null ] || { echo "no available $DEVICE simulator"; xcrun simctl list devices; exit 1; }
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run the checklist on the simulator
        # Screenshots come from the integration_test plugin, as on Android;
        # no code signing is needed for a simulator build.
        run: bash tools/checklist.sh "${{ steps.sim.outputs.udid }}"
      - name: Device log
        if: always()
        run: xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 30m --predicate 'process == "Runner"' > app/build/simulator-log.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.target }}
          path: |
            app/screenshots/
            app/build/integration_response_data.json
            app/build/simulator-log.txt
          if-no-files-found: error
          retention-days: 30

  store:
    name: Store listing screenshots
    # Only from a store build's run: the listings must show what the store
    # build shows (no Support band). gh workflow run screenshots.yml
    # -f distribution=appstore
    if: inputs.distribution == 'appstore'
    needs: [android, linux, web, windows, macos, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: shots
      - name: Frame them at the sizes the stores accept
        # store/README.md lists the surfaces; store/captions.json the words.
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core > /dev/null
          pip install --quiet pillow
          python3 tools/store-screenshots.py shots store-listing
      - uses: actions/upload-artifact@v7
        with:
          name: store-listing
          path: store-listing/
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak (from source, freedesktop 25.08)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # the .flatpak bundle goes on the release when this is a tag
    steps:
      - uses: actions/checkout@v7
      - name: The generated manifest must exist
        # flatpak-sources.yml writes it; until it has run once, nothing to build.
        run: |
          if [ ! -f packaging/flatpak/org.sevenreadings.SevenReadings.yml ]; then
            echo "no generated manifest: run flatpak-sources.yml first"
            exit 1
          fi
      - name: flatpak, a virtual display
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree dbus xvfb xdotool imagemagick
      - name: Runtime, SDK, the LLVM extension and Flathub's linter
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.llvm21//25.08 org.flatpak.Builder
      - name: Lint the submission manifest and the metainfo (Flathub's checks)
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/org.sevenreadings.SevenReadings.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream packaging/flatpak/org.sevenreadings.SevenReadings.metainfo.xml
      - name: Build the Flatpak from source in the sandbox, as Flathub does
        # The generated manifest, built by Flathub's own builder
        # (org.flatpak.Builder) with the flags its pipeline uses: --sandbox
        # (no network during the build: Flutter, the pub cache and the
        # content are all vendored sources), screenshots and icons mirrored
        # into the build (--mirror-screenshots-url together with
        # --compose-url-policy=full), the result exported to an OSTree repo,
        # the mirrored media committed as the screenshots/x86_64 ref, and the
        # repo linted, which is the check Flathub runs. --disable-rofiles-fuse:
        # the runner has no FUSE. dbus-run-session: the sandboxed builder
        # reaches the host's flatpak over the session bus, which a headless
        # runner does not have. Runtime, SDK and extension are installed above.
        run: |
          mkdir -p build/flatpak
          dbus-run-session -- flatpak run org.flatpak.Builder --force-clean --sandbox --user --install \
            --disable-rofiles-fuse \
            --mirror-screenshots-url=https://dl.flathub.org/media \
            --compose-url-policy=full --repo=build/flatpak/repo \
            build/flatpak/build packaging/flatpak/org.sevenreadings.SevenReadings.yml
          ostree commit --repo=build/flatpak/repo --canonical-permissions \
            --branch=screenshots/x86_64 build/flatpak/build/files/share/app-info/media
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo build/flatpak/repo
      - name: Launch it in the sandbox
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash tools/flatpak-smoke.sh
      - name: The installable bundle
        # One file a Linux user installs with `flatpak install`; it names
        # Flathub as where the runtime comes from. This is the Linux
        # channel (docs/plan.md, S3): the Flathub store is not, for now.
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build/flatpak/repo build/flatpak/sevenreadings.flatpak org.sevenreadings.SevenReadings
          ls -la build/flatpak/sevenreadings.flatpak
      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/flatpak/sevenreadings.flatpak --clobber
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-flatpak
          path: |
            app/screenshots/
            app/build/integration_response_data.json
            app/build/flatpak-run.log
            build/flatpak/sevenreadings.flatpak
          if-no-files-found: error
          retention-days: 30
