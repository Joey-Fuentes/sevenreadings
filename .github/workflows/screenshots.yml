name: Screenshots

# Runs the first-launch checklist (app/integration_test/app_test.dart) on
# every target that can run it headless, and keeps what each saw: the
# screenshots, the launch timings and (Android) the device log, as one
# `screenshots-<target>` artifact per job. The flatpak job builds the
# Flathub manifest from the bundle it just made, lints it with Flathub's
# linter and launches the sandboxed app once. On demand, weekly (after the
# build canary), and on every release tag; not on every push, because the
# emulator job takes about nine minutes. Remaining targets are docs/plan.md
# T3; the contact sheet on Pages is T4.

on:
  workflow_dispatch:
    inputs:
      content:
        description: Content to test against
        type: choice
        options: [release, sample]
        default: release
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"

env:
  CONTENT_MODE: ${{ inputs.content || 'release' }}

jobs:
  android:
    name: Android emulator (API 34, Pixel 6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: ./.github/actions/setup-flutter
      - name: Enable KVM
        # The emulator needs hardware acceleration; the runner has it but the
        # device node is root-only until this rule is loaded.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the checklist on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          # One command: the runner executes every line of `script` in its
          # own shell. The script builds the debug APK, installs it, runs
          # the test, keeps screenshots, timings and the device log, and
          # fails unless ten screenshots and both timings came out.
          script: bash tools/checklist.sh emulator-5554
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-android
          path: |
            app/screenshots/
            app/build/integration_response_data.json
            app/build/logcat.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux desktop (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - name: Linux build deps and a virtual display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb libgl1-mesa-dri
      - uses: ./.github/actions/setup-flutter
      - name: Run the checklist under Xvfb
        # The desktop window is 1280x720, so this exercises the side-by-side
        # reader layout; the emulator exercises the phone one. Screenshots
        # are rendered by the test itself (no integration_test plugin on
        # desktop) and written by the same driver.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash tools/checklist.sh linux
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-linux
          path: |
            app/screenshots/
            app/build/integration_response_data.json
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - run: tools/web-assets.sh
      - name: Run the checklist in Chrome
        # The runner's chromedriver ($CHROMEWEBDRIVER) drives a headless
        # Chrome; flutter drive serves a debug build to it.
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          bash tools/checklist.sh chrome
      - name: Build the site and prove it installs and works offline
        # The release build with our service worker, served locally: the
        # reader must come up, the worker must control the page, and after
        # the network is cut a reload must bring the reader back.
        run: |
          cd app && flutter build web --release --base-href "/" --dart-define=SR_DISTRIBUTION=web && cd ..
          python3 tools/web-sw.py app/build/web
          pip install --quiet selenium
          python3 tools/web-offline-check.py app/build/web app/screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-web
          path: |
            app/screenshots/
            app/build/integration_response_data.json
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak (freedesktop 26.08)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - name: Build deps, flatpak, a virtual display
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev flatpak flatpak-builder xvfb xdotool imagemagick python3-yaml
      - uses: ./.github/actions/setup-flutter
      - name: Build the Linux bundle
        working-directory: app
        run: flutter build linux --release --dart-define=SR_DISTRIBUTION=flathub
      - name: Runtime, SDK and Flathub's linter
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.flatpak.Builder
      - name: Lint the submission manifest and the metainfo (Flathub's checks)
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/org.sevenreadings.SevenReadings.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream packaging/flatpak/org.sevenreadings.SevenReadings.metainfo.xml
      - name: Build the Flatpak from the bundle just built
        # The same manifest with the archive source swapped for the bundle
        # directory; --disable-rofiles-fuse because the runner has no FUSE;
        # --mirror-screenshots-url fetches the metainfo's screenshots from
        # the site into the build and rewrites their URLs the way Flathub's
        # own build does, which its linter then checks for.
        run: |
          mkdir -p build/flatpak
          python3 tools/flatpak-ci-manifest.py packaging/flatpak/org.sevenreadings.SevenReadings.yml app/build/linux/x64/release/bundle > build/flatpak/manifest.yml
          flatpak-builder --user --install --force-clean --disable-rofiles-fuse \
            --mirror-screenshots-url=https://dl.flathub.org/media \
            build/flatpak/build build/flatpak/manifest.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder builddir build/flatpak/build
      - name: Launch it in the sandbox
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash tools/flatpak-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-flatpak
          path: |
            app/screenshots/
            app/build/integration_response_data.json
            app/build/flatpak-run.log
          if-no-files-found: error
          retention-days: 30
