# The template flatpak-flutter turns into the manifest Flathub receives
# (docs/plan.md, S3; docs/workflow.md, "Releasing"). Rendered by
# tools/flatpak-template.py into flatpak-flutter.yml (the @PLACEHOLDERS@
# come from app/content.lock and the commit or tag being packaged), then
# processed by flatpak-flutter, which replaces the Flutter git source with
# an offline SDK module, appends the offline pub cache and writes
# org.sevenreadings.SevenReadings.yml with its files under generated/.
# Both steps run in .github/workflows/flatpak-sources.yml.
#
# The build is entirely from source inside Flathub's sandbox, with no
# network: the app at a pinned commit, Flutter at its pinned tag, the pub
# cache from pubspec.lock, the content database as a checksummed file, and
# SQLite compiled from its amalgamation by package:sqlite3's own build hook
# (its documented `source: source` user-define, appended to the workspace
# pubspec by the build; everywhere else the app keeps the package's
# prebuilt library). foreign.json beside this file tells flatpak-flutter
# to leave sqlite3 to us: its registry patch targets another version.
#
# Runtime 25.08, not 26.08: Flutter's Linux build needs clang, which the
# base SDK does not ship; the LLVM extension has no 26.08 branch yet
# (flathub/org.freedesktop.Sdk.Extension.llvm21#9, September 2026). The
# linter's "newer runtime available" is a warning.
app-id: org.sevenreadings.SevenReadings
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: sevenreadings
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  # No --share=network: every text is in the app, and stays on the device.
modules:
  - name: sevenreadings
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin:/run/build/sevenreadings/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
      env:
        PUB_CACHE: /run/build/sevenreadings/.pub-cache
        # A home inside the build: the runner's sandbox leaked the host's
        # HOME=/home/runner, which does not exist in it, and the dart tool
        # keeps its state under $HOME. Flathub's builders never see a host home.
        HOME: /run/build/sevenreadings/.home
        # The Dart tools treat CI=true as "no telemetry"; in the sandbox the
        # first run of `dart run` blocked before opening a single file, on a
        # thread the telemetry layer waits for (fifth sandboxed run, 2026-09-16:
        # one process, futex wait, no files, no children).
        CI: 'true'
    build-commands:
      # The content database ships gzipped on the content release.
      - gunzip -c app/assets/content/sevenreadings.sqlite.gz > app/assets/content/sevenreadings.sqlite
      # SQLite from source (pub.dev/documentation/sqlite3, "Build hook options").
      - |
        cat >> pubspec.yaml <<'EOF'

        hooks:
          user_defines:
            sqlite3:
              source: source
              path: third_party/sqlite3/sqlite3.c
        EOF
      # The pub workspace (root pubspec.yaml lists app and packages/*);
      # resolution is offline against the pub cache flatpak-flutter vendored.
      - cd app && flutter pub get --offline
      # What the sqlite3 build hook will find (its user-define points at the
      # amalgamation; the hook needs a C compiler), and the hook's own
      # verbose output: dart run runs native build hooks before codegen. The
      # timeout turns a silent hang (first sandboxed run, 2026-09-16: 22
      # minutes without a line) into a reported failure.
      - mkdir -p "$HOME"; ls -l third_party/sqlite3/sqlite3.c; which clang; tail -n 8 pubspec.yaml; env | grep -i -E 'proxy|^home=|pub_cache' || true
      # The ladder: does dart start at all, does pub resolve, does codegen run.
      # Third sandboxed run (2026-09-16): dart run was silent for ten minutes
      # and never reached the hooks (no .dart_tool/hooks_runner appeared).
      - timeout --foreground 120 dart --version
      - timeout --foreground 300 dart pub get --offline
      # Codegen, two ways. First `dart run` with telemetry off (CI=true above);
      # if that is still silent after three minutes, the bare VM on
      # build_runner's entrypoint with --disable-dart-dev, which skips the
      # command-line layer whose start-up blocked in the sandbox (fifth run,
      # 2026-09-16: one process in a futex wait, no files open, no children).
      - |
        cd packages/sr_data
        cat /etc/resolv.conf 2>/dev/null || echo "no resolv.conf"
        dart run build_runner build --delete-conflicting-outputs &
        pid=$!
        for _ in $(seq 1 36); do
          kill -0 "$pid" 2>/dev/null || break
          sleep 5
        done
        if kill -0 "$pid" 2>/dev/null; then
          echo "--- dart run still silent after 3 minutes (wchan: $(cat /proc/$pid/wchan 2>/dev/null)); trying the bare VM ---"
          kill -9 "$pid" 2>/dev/null
          entry=$(ls -d "$PUB_CACHE"/hosted/pub.dev/build_runner-*/bin/build_runner.dart | head -n1)
          echo "entrypoint: $entry"
          timeout --foreground 600 dart --disable-dart-dev \
            --packages=/run/build/sevenreadings/.dart_tool/package_config.json \
            "$entry" build --delete-conflicting-outputs
        else
          wait "$pid"
        fi
      - cd app && flutter build linux --release --no-pub --dart-define=SR_DISTRIBUTION=flathub
      - mkdir -p /app/lib/sevenreadings
      - cp -a app/build/linux/*/release/bundle/. /app/lib/sevenreadings/
      - install -Dm755 packaging/flatpak/sevenreadings.sh /app/bin/sevenreadings
      - install -Dm644 packaging/flatpak/org.sevenreadings.SevenReadings.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/org.sevenreadings.SevenReadings.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/icon/org.sevenreadings.SevenReadings.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 packaging/icon/org.sevenreadings.SevenReadings-128.png /app/share/icons/hicolor/128x128/apps/org.sevenreadings.SevenReadings.png
      - install -Dm644 packaging/icon/org.sevenreadings.SevenReadings-256.png /app/share/icons/hicolor/256x256/apps/org.sevenreadings.SevenReadings.png
      - install -Dm644 packaging/icon/org.sevenreadings.SevenReadings-512.png /app/share/icons/hicolor/512x512/apps/org.sevenreadings.SevenReadings.png
    sources:
      - type: git
        url: https://github.com/Joey-Fuentes/sevenreadings.git
        @APP_REF@
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: '@FLUTTER_TAG@'
        dest: flutter
      - type: file
        url: https://github.com/Joey-Fuentes/sevenreadings/releases/download/content-v@CONTENT_VERSION@/sevenreadings.sqlite.gz
        sha256: '@CONTENT_SHA256@'
        dest: app/assets/content
        dest-filename: sevenreadings.sqlite.gz
      - type: file
        url: https://github.com/Joey-Fuentes/sevenreadings/releases/download/content-v@CONTENT_VERSION@/manifest.json
        sha256: '@CONTENT_MANIFEST_SHA256@'
        dest: app/assets/content
        dest-filename: manifest.json
      - type: archive
        url: https://sqlite.org/@SQLITE_PATH@
        sha256: '@SQLITE_SHA256@'
        dest: third_party/sqlite3
