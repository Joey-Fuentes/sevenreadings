name: Content release

# Runs whenever anything that affects the content database lands on main,
# publishes it as a GitHub Release, pins it in app/content.lock, and kicks CI
# so the pinned content gets built and deployed. No manual steps.

on:
  push:
    branches: [main]
    paths:
      - pipeline/**
      - packages/sr_data/lib/src/schema/content.drift
  workflow_dispatch:
    inputs:
      version:
        description: Content version (default <date>-<sha>)
        default: ""
      sources:
        description: Comma-separated source ids, or "all"
        default: all
      strict:
        description: Fail if any selected source is not wired
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: content-release
  cancel-in-progress: false

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Content version: $v"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-dependency-glob: pipeline/pyproject.toml
      - name: Cache upstream downloads
        uses: actions/cache@v6
        with:
          path: pipeline/.cache
          key: upstream-${{ hashFiles('pipeline/sources.toml') }}
      - name: Build
        working-directory: pipeline
        run: |
          uv sync
          uv run srp build --version "${{ steps.version.outputs.version }}" \
            --only "${{ inputs.sources || 'all' }}" \
            ${{ inputs.strict && '--strict' || '' }} \
            --out dist/sevenreadings.sqlite
      - name: Package
        id: package
        working-directory: pipeline/dist
        run: |
          gzip -9 -k sevenreadings.sqlite
          sha256sum sevenreadings.sqlite.gz manifest.json > SHA256SUMS
          cat SHA256SUMS
          echo "sha256=$(sha256sum sevenreadings.sqlite.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "counts=$(jq -c .counts manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: content-v${{ steps.version.outputs.version }}
          name: Content ${{ steps.version.outputs.version }}
          body: |
            Content database built from `pipeline/sources.toml` at ${{ github.sha }}.
            Counts: `${{ steps.package.outputs.counts }}`
          files: |
            pipeline/dist/sevenreadings.sqlite.gz
            pipeline/dist/manifest.json
            pipeline/dist/SHA256SUMS
      - name: Pin in app/content.lock
        run: |
          jq -n --arg v "${{ steps.version.outputs.version }}" \
                --arg s "${{ steps.package.outputs.sha256 }}" \
                '{version: $v, asset: "sevenreadings.sqlite.gz", sha256: $s}' > app/content.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/content.lock
          git commit -m "content: pin ${{ steps.version.outputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Run CI on the pinned content
        # Pushes made with GITHUB_TOKEN do not trigger workflows, so ask for one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
