name: Dart lockfile

# Generates pubspec.lock on the pinned Flutter and commits it, so every later
# build resolves exactly the versions recorded here instead of whatever pub.dev
# has newest that day (objective_c 9.6.1 broke a build that way, 2026-09-15).
# Runs when a pubspec.yaml changes, and on demand to upgrade deliberately.

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
      - app/pubspec.yaml
      - packages/*/pubspec.yaml
  workflow_dispatch:
    inputs:
      upgrade:
        description: Run `flutter pub upgrade` (newest compatible versions) instead of a plain resolve
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: lockfile
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve
        run: |
          if [ "${{ inputs.upgrade }}" = "true" ]; then flutter pub upgrade; else flutter pub get; fi
      - name: Commit pubspec.lock if it changed
        run: |
          if git diff --quiet -- pubspec.lock && git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo "pubspec.lock unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "deps: lock Dart dependencies ($(flutter --version --machine | jq -r .flutterVersion))"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Run CI on the locked dependencies
        # Pushes made with GITHUB_TOKEN do not trigger workflows, so ask for one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
