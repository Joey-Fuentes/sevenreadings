name: Build all targets

on:
  workflow_dispatch:
    inputs:
      content:
        description: Content to bundle
        type: choice
        options: [release, sample]
        default: release
  workflow_call:
    inputs:
      content:
        type: string
        default: release
      upload:
        description: Send the signed iOS archive to App Store Connect (TestFlight) instead of exporting an .ipa
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 1" # weekly canary against latest stable Flutter

env:
  CONTENT_MODE: ${{ inputs.content || 'release' }}

jobs:
  content:
    name: Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          mode: ${{ env.CONTENT_MODE }}
          token: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: content
          path: app/assets/content/
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android
    needs: content
    runs-on: ubuntu-latest
    env:
      # Signing secrets (docs/workflow.md, "Signing"). Absent on forks and
      # until the maintainer sets them: the build is then debug-signed and
      # says so. Job-level so the steps' `if` can see them.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: content, path: app/assets/content }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: ./.github/actions/setup-flutter
      - name: Release signing key (when the secret exists)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "ANDROID_KEYSTORE_BASE64 is set but ANDROID_$v is not" >&2; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/upload-keystore.jks
          # Both files are gitignored; build.gradle.kts reads the second.
          cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "release signing: upload key '$KEY_ALIAS'"
      # SR_DISTRIBUTION decides whether the Support screen shows outside
      # payment links: the APK is a direct download, the AAB goes to Play.
      - working-directory: app
        run: flutter build apk --release --dart-define=SR_DISTRIBUTION=direct
      - working-directory: app
        run: flutter build appbundle --release --dart-define=SR_DISTRIBUTION=play
      - name: Which key signed them
        # Prints the signing certificate of both outputs. With the secrets
        # present it must not be the debug key; without them it must be.
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          aab=app/build/app/outputs/bundle/release/app-release.aab
          "$apksigner" verify --print-certs "$apk" | tee build-apk-cert.txt
          keytool -printcert -jarfile "$aab" | tee build-aab-cert.txt
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ! grep -q "Android Debug" build-apk-cert.txt build-aab-cert.txt || { echo "secrets present but the outputs are debug-signed" >&2; exit 1; }
            echo "signed with the upload key"
          else
            grep -q "Android Debug" build-apk-cert.txt || { echo "no secrets, yet not debug-signed?" >&2; exit 1; }
            echo "debug-signed (no ANDROID_KEYSTORE_BASE64 secret)"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  web:
    name: Web
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: content, path: app/assets/content }
      - uses: ./.github/actions/setup-flutter
      - run: tools/web-assets.sh
      - working-directory: app
        run: flutter build web --release --dart-define=SR_DISTRIBUTION=web
      - uses: actions/upload-artifact@v7
        with: { name: web, path: app/build/web }

  linux:
    name: Linux (${{ matrix.arch }})
    needs: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x64 }
          # No arm64: Flutter publishes no Linux arm64 SDK, so that job can
          # never resolve a toolchain (first full build, 2026-09-15).
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: content, path: app/assets/content }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: ./.github/actions/setup-flutter
      - working-directory: app
        run: flutter build linux --release --dart-define=SR_DISTRIBUTION=direct
      - name: Package
        run: |
          bundle=$(find app/build/linux -type d -path '*/release/bundle' | head -n1)
          tar -C "$(dirname "$bundle")" -czf sevenreadings-linux-${{ matrix.arch }}.tar.gz bundle
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: sevenreadings-linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows
    needs: content
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: content, path: app/assets/content }
      - uses: ./.github/actions/setup-flutter
      - working-directory: app
        run: flutter build windows --release --dart-define=SR_DISTRIBUTION=direct
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath sevenreadings-windows-x64.zip
      - name: MSIX for the Microsoft Store
        # A second build with the store's distribution flag (no Support
        # links), packaged by the msix package (app/pubspec.yaml,
        # msix_config). With the Partner Center secrets the package carries
        # the Store identity and is left unsigned, as the Store signs on
        # submission; without them it carries the placeholder identity and
        # the package's test certificate, so it exists and can be
        # inspected but installs only where that certificate is trusted.
        # The Store requires a.b.c.0: the pubspec version, revision 0.
        shell: bash
        env:
          MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
          MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          cd app
          flutter build windows --release --dart-define=SR_DISTRIBUTION=msstore
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/').0"
          if [ -n "$MSSTORE_PUBLISHER" ]; then
            [ -n "$MSSTORE_IDENTITY_NAME" ] && [ -n "$MSSTORE_PUBLISHER_DISPLAY_NAME" ] \
              || { echo "MSSTORE_PUBLISHER is set but MSSTORE_IDENTITY_NAME or MSSTORE_PUBLISHER_DISPLAY_NAME is not" >&2; exit 1; }
            dart run msix:create --store --version "$version" \
              --publisher "$MSSTORE_PUBLISHER" --identity-name "$MSSTORE_IDENTITY_NAME" \
              --publisher-display-name "$MSSTORE_PUBLISHER_DISPLAY_NAME"
            echo "MSIX with the Store identity, unsigned (the Store signs it)"
          else
            dart run msix:create --version "$version" --install-certificate false
            echo "MSIX with the placeholder identity and the test certificate (no MSSTORE_PUBLISHER secret)"
          fi
          cd ..
          ls -la sevenreadings-windows.msix
          unzip -p sevenreadings-windows.msix AppxManifest.xml | tr -d '\r' | grep -oE '<Identity [^>]*>|<DisplayName>[^<]*|<PublisherDisplayName>[^<]*'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            sevenreadings-windows-x64.zip
            sevenreadings-windows.msix

  macos:
    name: macOS
    needs: content
    runs-on: macos-latest
    env:
      # Developer ID signing and notarization (docs/workflow.md, "Signing").
      # Without the certificate secret the .app ships ad-hoc signed, as
      # before, and Gatekeeper will warn. Developer ID certificates cannot
      # be cloud-managed through an API key (Apple bug FB16835802), hence a
      # .p12 here where the ios job needs only the key.
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: content, path: app/assets/content }
      - uses: ./.github/actions/setup-flutter
      - working-directory: app
        run: flutter build macos --release --dart-define=SR_DISTRIBUTION=direct
      - name: Developer ID certificate (when the secret exists)
        if: env.APPLE_DEVELOPER_ID_P12_BASE64 != ''
        id: keychain
        uses: ./.github/actions/apple-keychain
        with:
          p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      - name: Sign, notarize, staple, DMG (when the secret exists)
        if: env.APPLE_DEVELOPER_ID_P12_BASE64 != ''
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app=app/build/macos/Build/Products/Release/sevenreadings.app
          identity=$(security find-identity -v -p codesigning "${{ steps.keychain.outputs.keychain }}"             | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "signing as: $identity"
          # Inside out: every framework and dylib, then the app with the
          # hardened runtime and the release entitlements.
          find "$app/Contents/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$identity" "{}"
          codesign --force --timestamp --options runtime \
            --entitlements app/macos/Runner/Release.entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # The DMG is what people download; it is signed, notarized and
          # stapled as a whole, with the signed app inside.
          mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Seven Readings" -srcfolder dmg -ov -format UDZO sevenreadings-macos.dmg
          codesign --force --timestamp --sign "$identity" sevenreadings-macos.dmg
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit sevenreadings-macos.dmg --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          xcrun stapler staple sevenreadings-macos.dmg
          spctl -a -vv -t open --context context:primary-signature sevenreadings-macos.dmg
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Package
        # The zip is the unsigned-or-signed .app either way; the DMG exists
        # only on a signed run.
        run: |
          ditto -c -k --keepParent app/build/macos/Build/Products/Release/sevenreadings.app sevenreadings-macos.zip
          codesign -dv --verbose=2 app/build/macos/Build/Products/Release/sevenreadings.app 2>&1 | grep -E '^(Authority|Signature|TeamIdentifier)' || true
      - name: Remove the temporary keychain
        if: always() && steps.keychain.outputs.keychain != ''
        run: security delete-keychain "${{ steps.keychain.outputs.keychain }}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            sevenreadings-macos.zip
            sevenreadings-macos.dmg

  ios:
    name: iOS
    needs: content
    runs-on: macos-latest
    env:
      # App Store signing through an App Store Connect API key with the
      # Admin role (docs/workflow.md, "Signing"): xcodebuild's cloud signing
      # creates the managed Apple Distribution certificate and the profile.
      # Without the key: an unsigned .app, as before.
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: content, path: app/assets/content }
      - uses: ./.github/actions/setup-flutter
      - name: Unsigned build (no API key secret)
        if: env.APPLE_API_KEY_P8_BASE64 == ''
        run: |
          cd app && flutter build ios --release --no-codesign --dart-define=SR_DISTRIBUTION=appstore && cd ..
          ditto -c -k --keepParent app/build/ios/iphoneos/Runner.app sevenreadings-ios-unsigned.zip
      - name: Signed archive and App Store .ipa (when the API key exists)
        if: env.APPLE_API_KEY_P8_BASE64 != ''
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in API_KEY_ID API_ISSUER_ID TEAM_ID; do
            [ -n "${!v}" ] || { echo "APPLE_API_KEY_P8_BASE64 is set but APPLE_$v is not" >&2; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" \
                -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID")
          cd app
          # Flutter writes the Xcode configuration (Generated.xcconfig, the
          # dart defines); xcodebuild then archives with the team's signing.
          flutter build ios --release --config-only --dart-define=SR_DISTRIBUTION=appstore
          destination=$([ "${{ inputs.upload }}" = "true" ] && echo upload || echo export)
          sed -e "s/@TEAM_ID@/$TEAM_ID/" -e "s/@DESTINATION@/$destination/" ios/ExportOptions.plist > build/ExportOptions.plist
          echo "export destination: $destination"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=iOS -archivePath build/ios/Runner.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${auth[@]}"
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ios/ipa "${auth[@]}"
          rm -f "$key"
          if [ "$destination" = export ]; then
            ls -la build/ios/ipa
            cp build/ios/ipa/*.ipa ../sevenreadings-ios.ipa
          else
            echo "uploaded to App Store Connect; it appears under TestFlight after processing"
          fi
          codesign -dv --verbose=2 build/ios/Runner.xcarchive/Products/Applications/Runner.app 2>&1 | grep -E '^(Authority|TeamIdentifier)'
      - uses: actions/upload-artifact@v7
        # Empty on a release tag with the Apple secrets: the archive went
        # to App Store Connect instead of into a file.
        with:
          name: ios
          path: |
            sevenreadings-ios-unsigned.zip
            sevenreadings-ios.ipa
          if-no-files-found: ignore
