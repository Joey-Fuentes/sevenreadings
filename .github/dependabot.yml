version: 2
updates:
  - package-ecosystem: github-actions
    # Composite actions are only scanned when listed explicitly.
    directories:
      - /
      - /.github/actions/content
      - /.github/actions/setup-flutter
    schedule: { interval: weekly }
  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly }
    groups:
      dart: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /pipeline
    schedule: { interval: weekly }
