# One entry per source. Pins and checksums make content builds reproducible.
#
#   kind            parser family (see sevenreadings_pipeline/registry.py)
#   url / repo+commit  where to fetch; fill sha256 with `uv run srp lock <id>`
#   license         human-readable license of the *text we ship*
#   license_status  clear | review | blocked   (blocked sources are skipped)
#
# URLs below are the best-known upstream locations and MUST be verified on the
# first real build. See docs/licensing.md for the reasoning behind each status.

# ---------------------------------------------------------------- Bibles

[bsb]
kind = "usfm_zip"
name = "Berean Standard Bible"
abbreviation = "BSB"
language = "en"
url = "https://ebible.org/Scriptures/engbsb_usfm.zip"
sha256 = "c065fa11decc416071985692b959dbd49506b188dc354e37805941f248b3da9e"
license = "Public domain (CC0 dedication, 2023)"
license_status = "clear"

[web]
kind = "usfm_zip"
name = "World English Bible"
abbreviation = "WEB"
language = "en"
url = "https://ebible.org/Scriptures/engwebp_usfm.zip"
sha256 = "75dcc1a987cc7bade801b138ed23f9c4a6223abd0aa8664d337705940ba9571e"
license = "Public domain"
license_status = "clear"

[webc]
kind = "usfm_zip"
name = "World English Bible Catholic Edition"
abbreviation = "WEBC"
language = "en"
url = "https://ebible.org/Scriptures/eng-web-c_usfm.zip"
sha256 = "37f5086f0b65b9843118bfdb9a4c5c6cdaac8cb03df5121b32b14965cafd1e1d"
remap = "catholic"   # Greek Daniel/Esther and Letter of Jeremiah handling, see deuterocanon.py
license = "Public domain"
license_status = "clear"

[douay]
kind = "haydock_bible"
name = "Douay-Rheims Bible (Challoner)"
abbreviation = "DRB"
language = "en"
# The Douay text quoted on every page of the Haydock transcription (same archive
# as the haydock source; one download serves both). Pin a commit of the GitLab repo:
#   curl -s https://gitlab.com/api/v4/projects/JohnBlood%2Fhaydock/repository/branches/master | jq -r .commit.id
# then replace 184c10385ba90f7127fc1c0ec69b93656db1fdb0 here and in the haydock entry, and `srp lock douay`.
url = "https://gitlab.com/JohnBlood/haydock/-/archive/184c10385ba90f7127fc1c0ec69b93656db1fdb0/haydock-184c10385ba90f7127fc1c0ec69b93656db1fdb0.zip"
sha256 = "aad542c2bfb2a3ab7869a9cf9057a7c823c63ba3b3b7deb2643cd2efa4e21112"
glob = "*/id[0-9]*.html"   # chapter pages; confraternity/ is excluded by the parser
versification = "vul"   # Vulgate numbering -> canonical, see versification.apply_vul
reference = "web"
license = "Public domain (Douay 1582-1610, Challoner revision 1749-52; transcription unlicensed, no new copyright: see NOTICE)"
license_status = "clear"

# ------------------------------------------------- Original languages

[sblgnt]
kind = "archive"
name = "SBL Greek New Testament"
abbreviation = "SBLGNT"
language = "grc"
# Pin a commit: gh api repos/Faithlife/SBLGNT/commits/master --jq .sha
url = "https://github.com/Faithlife/SBLGNT/archive/c4d241a9c1c479a55b989ba35a4976c1d0b8052c.zip"
sha256 = "4fc2659ce10ec6f57552f22e039de927ed3e417c7b5a757f34f05dae530e4c0f"
format = "ref_tab_text"
glob = "*/data/sblgnt/text/*.txt"   # not sblgntapp: that is the apparatus
license = "CC BY 4.0 (Society of Biblical Literature and Logos Bible Software, 2010)"
license_status = "clear"

[byz]
kind = "archive"
name = "Byzantine Majority Text (Robinson-Pierpont 2018)"
abbreviation = "BYZ"
language = "grc"
# Release v3.3.2 (2024-12-31). Newer: gh api repos/byztxt/byzantine-majority-text/commits/master --jq .sha
url = "https://github.com/byztxt/byzantine-majority-text/archive/27a45ff1b7be6c17ccbfeac414f3f55732ae8e28.zip"
sha256 = "5093aa23b9302394cadc0a49fc04c70d4d99749c4ca2e580cfd7bbea1b0f9955"
format = "byz_csv"
glob = "*/csv-unicode/ccat/no-variants/*.csv"   # accented text, no apparatus
align = "nt"   # report NT verses that do not line up with `reference`
reference = "web"
license = "Public domain (The Unlicense; text of Robinson and Pierpont, 2018 edition)"
license_status = "clear"

[wlc]
kind = "archive"
name = "Westminster Leningrad Codex"
abbreviation = "WLC"
language = "hbo"
direction = "rtl"
# Pin a commit: gh api repos/openscriptures/morphhb/commits/master --jq .sha
url = "https://github.com/openscriptures/morphhb/archive/3d15126fb1ef74867fc1434be1942e837932691f.zip"
sha256 = "f56c150708b5d74719ecb709c712c31eae9855bca7b111fd82ec91b5d177b4c7"
format = "oshb_osis"
glob = "*/wlc/*.xml"
versification = "mt"   # Masoretic numbering -> canonical, checked against `reference`
reference = "web"
license = "CC BY 4.0 (Open Scriptures Hebrew Bible); WLC text itself is public domain"
license_status = "clear"

[lxx]
kind = "lxx_tokens"
name = "Septuagint (Swete)"
abbreviation = "LXX"
language = "grc"
# Pin a commit: gh api repos/nathans/lxx-swete/commits/master --jq .sha
url = "https://github.com/nathans/lxx-swete/archive/26bad3eb42bba98471d154c954e36a6f30a0279d.zip"
sha256 = "e85c7740c7845afca6b367bf853c3238f9264cb75b775487858262918b078e1e"
glob = "*/data/*.txt"
reference = "web"
license = "CC BY-SA 4.0 (digitisation via First1KGreek / Open Greek and Latin); Swete's edition is public domain"
license_status = "clear"

# ------------------------------------------------------------ Commentaries

[rashi]
kind = "sefaria_export"
perspective = "jewish_literal"
author = "Rashi"
title = "Rashi on Tanakh"
# Sefaria's database export on Hugging Face, pinned by commit:
#   https://huggingface.co/Sefaria/database_export/commits/main
repo = "Sefaria/database_export"
commit = "b4acd284c9659637039197a6ab42c0241366e37f"
path = "json/Tanakh/Rishonim on Tanakh/Rashi"
# Per book, the largest English version whose license is Public Domain, CC0,
# CC BY or CC BY-SA is read, these titles first; NC versions are never read.
prefer = [
  "Pentateuch with Rashi's commentary by M. Rosenbaum and A.M. Silbermann, 1929-1934",
  "Sefaria Community Translation",
]
reference = "web"
license = "Hebrew: public domain. English: per version; only Public Domain, CC0, CC BY and CC BY-SA versions are shipped (the build lists them)"
license_status = "clear"

