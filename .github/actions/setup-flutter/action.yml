name: Set up Flutter workspace
description: Install the pinned Flutter, restore caches, resolve the pub workspace, run drift codegen.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        # Exact pin, mirrored in .fvmrc: CI resolved 3.47.4 on 2026-09-15 and the
        # dependency override in the root pubspec.yaml is written against it.
        # Bump both together, and revisit that override when you do.
        flutter-version: 3.47.4
        channel: stable
        cache: true
    - name: Resolve workspace
      shell: bash
      run: flutter pub get
    - name: Generate drift code
      shell: bash
      working-directory: packages/sr_data
      run: dart run build_runner build --delete-conflicting-outputs
