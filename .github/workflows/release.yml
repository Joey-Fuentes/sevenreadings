name: App release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      content: release
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$(find artifacts/android -name '*.apk' | head -n1)" release/sevenreadings-android.apk
          cp "$(find artifacts/android -name '*.aab' | head -n1)" release/sevenreadings-android.aab
          cp artifacts/linux-x64/*.tar.gz release/
          cp artifacts/windows-x64/*.zip artifacts/macos/*.zip artifacts/ios/*.zip release/
          # Present only on signed runs (build.yml: Developer ID, App Store key).
          for f in artifacts/macos/*.dmg artifacts/ios/*.ipa artifacts/windows-x64/*.msix; do if [ -e "$f" ]; then cp "$f" release/; fi; done
          (cd artifacts/web && zip -qr ../../release/sevenreadings-web.zip .)
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -la release
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
