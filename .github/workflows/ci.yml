name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze & test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # analyze treats the missing content assets as (fatal) warnings.
      - uses: ./.github/actions/content
        with:
          mode: sample
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test sr_core
        working-directory: packages/sr_core
        run: dart test
      - name: Test sr_data
        working-directory: packages/sr_data
        run: flutter test
      - name: Test app
        working-directory: app
        run: flutter test

  pipeline:
    name: Lint & test (pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  smoke:
    name: Smoke build (web + linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/content
        with:
          # PRs stay hermetic. Pushes to main use the pinned content release
          # once one exists, so the Pages deployment below ships real content.
          mode: ${{ github.event_name == 'push' && 'auto' || 'sample' }}
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-flutter
      - name: Bootstrap platform folders
        # Platform folders are not committed until `make bootstrap` has been run
        # and committed; this keeps the smoke build working before then.
        working-directory: app
        run: flutter create --org org.sevenreadings --project-name sevenreadings --platforms=linux,web .
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Web runtime assets
        run: tools/web-assets.sh
      - name: Build web
        working-directory: app
        # Project Pages sites live under /<repo>/; drop --base-href for a
        # custom domain or a <user>.github.io repository.
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Build linux
        working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: app/build/web

  pages:
    name: Deploy web app to GitHub Pages
    # Only after every CI job passed on main. Never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [dart, pipeline, smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
